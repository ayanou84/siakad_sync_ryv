name: SIAKAD Auto Sync Data

on:
  schedule:
    # Berjalan otomatis setiap hari jam 05:00 WIB (sama dengan jam 22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch: # Mengaktifkan tombol "Run workflow" manual di web GitHub

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright supabase python-dotenv google-genai requests
        playwright install chromium

    - name: Run Scraper Script
      env:
        # Menarik kredensial aman dari GitHub Secrets
        GITHUB_ACTIONS: "true"
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GEMINI_PRIMARY_KEY: ${{ secrets.GEMINI_PRIMARY_KEY }}
        GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
      run: python sync_script.py
