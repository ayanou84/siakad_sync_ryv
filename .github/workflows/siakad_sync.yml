name: SIAKAD Sync Scraper

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependensi & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 supabase google-genai playwright python-dotenv
          playwright install --with-deps chromium

      - name: Jalankan Script Scraper
        env:
          SIAKAD_USER: ${{ secrets.SIAKAD_USER }}
          SIAKAD_PASSWORD: ${{ secrets.SIAKAD_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_PRIMARY_KEY: ${{ secrets.GEMINI_PRIMARY_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
        run: python main.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-screenshots
          path: "*.png"
          retention-days: 1
